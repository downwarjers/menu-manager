<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>餐廳菜單管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js"
        }
      }
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-gray-100 text-gray-800 font-sans pb-32">
    <div id="app" class="max-w-xl mx-auto min-h-screen p-3 sm:p-5">
      <!-- 備份過期安全警示橫條 -->
      <div
        v-if="backupWarning"
        class="bg-amber-100 border border-amber-300 text-amber-900 px-4 py-3 rounded-2xl mb-3 text-sm sm:text-base flex flex-col sm:flex-row justify-between items-center gap-2 font-bold shadow-sm"
      >
        <span class="text-center sm:text-left">⚠️ 已超過 7 天未備份！建議點擊備份防遺失</span>
        <button
          @click="triggerBackup"
          class="w-full sm:w-auto bg-amber-600 active:bg-amber-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm"
        >
          立刻備份
        </button>
      </div>

      <!-- 頂部列：資料維護中樞 -->
      <header-bar @open-channels="openModal('channelConfig')"></header-bar>

      <!-- 標籤導航 -->
      <div
        class="flex border-b border-gray-300 mb-4 text-center text-base sm:text-lg font-bold bg-white rounded-2xl overflow-hidden shadow-sm"
      >
        <button
          @click="currentTab = 'dishes'"
          :class="currentTab === 'dishes' ? 'border-b-4 border-amber-600 text-amber-700 bg-amber-50/60' : 'text-gray-500'"
          class="flex-1 py-3.5 transition-colors"
        >
          料理 ({{ store.dishes.length }})
        </button>
        <button
          @click="currentTab = 'packages'"
          :class="currentTab === 'packages' ? 'border-b-4 border-rose-600 text-rose-700 bg-rose-50/60' : 'text-gray-500'"
          class="flex-1 py-3.5 transition-colors"
        >
          套餐 ({{ store.packages.length }})
        </button>
        <button
          @click="currentTab = 'base'"
          :class="currentTab === 'base' ? 'border-b-4 border-blue-600 text-blue-700 bg-blue-50/60' : 'text-gray-500'"
          class="flex-1 py-3.5 transition-colors"
        >
          基礎庫
        </button>
      </div>

      <!-- 標籤分頁內容 -->
      <dish-list v-if="currentTab === 'dishes'" @edit="openDishModal"></dish-list>
      <package-list v-if="currentTab === 'packages'" @edit="openPackageModal"></package-list>
      <base-data-list
        v-if="currentTab === 'base'"
        @edit-ingredient="openIngredientModal"
        @edit-simple="openSimpleBaseModal"
      ></base-data-list>

      <!-- 彈窗群組 -->
      <channel-modal v-if="modalType === 'channelConfig'" @close="closeModal"></channel-modal>
      <dish-modal
        v-if="modalType === 'dish'"
        :dish-data="editingDish"
        @close="closeModal"
      ></dish-modal>
      <package-modal
        v-if="modalType === 'package'"
        :pkg-data="editingPackage"
        @close="closeModal"
      ></package-modal>
      <ingredient-modal
        v-if="modalType === 'ingredientForm'"
        :target-index="editingIngredientIndex"
        @close="closeModal"
      ></ingredient-modal>
      <simple-base-modal
        v-if="['method', 'category'].includes(modalType)"
        :type="modalType"
        :target-index="editingSimpleIndex"
        @close="closeModal"
      ></simple-base-modal>

      <!-- 右下角浮動按鈕 (FAB) -->
      <div class="fixed right-4 bottom-5 flex flex-col gap-3 z-40">
        <button
          v-if="currentTab === 'dishes'"
          @click="openDishModal(null)"
          class="bg-amber-600 active:bg-amber-700 text-white px-5 py-3 rounded-full shadow-xl font-bold text-base flex items-center gap-2 border-2 border-white"
        >
          <span class="text-xl leading-none">+</span> 新增料理
        </button>
        <button
          v-if="currentTab === 'packages'"
          @click="openPackageModal(null)"
          class="bg-rose-600 active:bg-rose-700 text-white px-5 py-3 rounded-full shadow-xl font-bold text-base flex items-center gap-2 border-2 border-white"
        >
          <span class="text-xl leading-none">+</span> 組合套餐
        </button>
      </div>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
